[project]
name = "ai-hunter"
version = "0.1.0"
description = "Multi-agent B2B lead hunting system powered by LangGraph"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live: marks tests as live integration tests that hit the real license server (deselect with '-m not live')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Only enforce rules that catch real bugs. Style nags (N: pep8-naming,
# W: pycodestyle warnings) and E501 (line-too-long) are intentionally
# excluded — they create noise without catching real defects. Re-enable
# when the team is ready to enforce them.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line-too-long
    "E402",  # module-import-not-at-top-of-file (we do this in several places intentionally)
    "E701",  # multiple-statements-on-one-line-colon
    "E741",  # ambiguous-variable-name (l, I, O)
    "F841",  # unused-variable: pre-existing tech debt, mostly in tests
]
