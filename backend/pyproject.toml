[project]
name = "ai-hunter-backend"
version = "0.1.0"
description = "AI Hunter — automated B2B lead hunting + outreach backend"
requires-python = ">=3.12,<3.13"
readme = "../README.md"
authors = [{ name = "AI Hunter Team" }]

dependencies = [
    # LangGraph + LangChain
    "langgraph>=0.2.0,<1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",

    # LLM multi-provider
    "litellm>=1.50.0,<2.0.0",

    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sse-starlette>=2.0.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "dnspython>=2.6.0,<3.0.0",

    # Data validation & config
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",

    # HTTP client
    "httpx>=0.27.0,<1.0.0",

    # Retry logic (used by jina_reader and google_search)
    "tenacity>=8.0.0,<10.0.0",

    # License module dependencies
    "cryptography>=43.0.0,<46.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",

    # Observability
    "langfuse>=2.50.0,<3.0.0",

    # Search backends
    "tavily-python>=0.5.0,<1.0.0",

    # Microsoft Graph (Application permission / client_credentials)
    "msal>=1.27.0,<2.0.0",

    # User auth
    "bcrypt>=4.2.0,<5.0.0",
    "itsdangerous>=2.2.0,<3.0.0",

    # Document parsing
    "pymupdf4llm>=0.0.10,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pandas>=2.0.0,<3.0.0",
    "python-docx>=1.1.0,<2.0.0",

    # Phone number parsing & normalization (lead extraction)
    "phonenumbers>=8.13.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.6.0,<1.0.0",
]

# ── uv-specific config ──────────────────────────────────────
[tool.uv]
# Allow uv to download a managed Python 3.12 so dev/CI share the same
# interpreter version even on systems without 3.12 pre-installed.
python-preference = "managed"
required-version = ">=0.4.0"

# ── ruff config (mirrors existing CI) ───────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "MagicMock", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"scripts/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"