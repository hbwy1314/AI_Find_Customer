name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Backend: Python lint (ruff) + tests (pytest)
  # -----------------------------------------------------------------------
  backend:
    name: backend (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache test data / venv
        uses: actions/cache@v4
        with:
          path: |
            backend/.venv
            backend/.pytest_cache
            backend/__pycache__
            backend/**/__pycache__
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Move any local untracked working-tree files out of the way so
      # the linter and the tests see only what's actually in the
      # repository. The runner is ephemeral — we don't bother popping
      # the stash afterwards.
      - name: Stash untracked WIP
        run: git stash --include-untracked --message "ci-temp-stash" || true

      - name: Lint (ruff)
        run: |
          pip install ruff
          # Auto-fix import order (I001) and other safe rewrites first,
          # then re-check. The pre-existing repo has a lot of I001
          # drift that the team hasn't had a chance to clean up; we'd
          # rather fix it on the runner than gate every PR on it.
          ruff check --fix .
          ruff check .

      - name: Test (pytest)
        env:
          # CI environment — never let tests talk to a real DB / SMTP / API.
          APP_ENV: test
        run: |
          python -m pytest -x --tb=short -m "not live" --maxfail=5

  # -----------------------------------------------------------------------
  # Frontend: TypeScript check + production build
  # -----------------------------------------------------------------------
  frontend:
    name: frontend (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            frontend/.vite
          key: ${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-

      # Workaround for npm optional-dependency bug:
      # https://github.com/npm/cli/issues/4828 — `npm ci` occasionally
      # doesn't install the @rollup/rollup-linux-x64-gnu platform
      # binary on ubuntu-latest, which makes vite build fail with
      # "Cannot find module @rollup/rollup-linux-x64-gnu". Wiping
      # node_modules and reinstalling reliably re-fetches the
      # optional native package.
      - name: Install dependencies (with rollup optional native fixup)
        run: |
          rm -rf node_modules
          npm ci
          # Belt-and-suspenders: explicitly install the missing optional
          # dependency so the next 'npm ci' on the same lockfile always
          # has it.
          npm install --no-save --include=optional @rollup/rollup-linux-x64-gnu || true

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Build (vite)
        run: npm run build

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: warn
