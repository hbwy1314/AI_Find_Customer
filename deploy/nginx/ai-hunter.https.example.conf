# AI Hunter — nginx site config (HTTPS front of FastAPI + static frontend)
#
# Place at /etc/nginx/sites-available/ai-hunter.conf and symlink into sites-enabled.
# TLS material is managed by certbot.
#
# Usage:
#   1. Replace `aih.example.com` with your real hostname (3 places).
#   2. Run `certbot --nginx -d aih.example.com`.
#   3. `sudo nginx -t && sudo systemctl reload nginx`.

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aih.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS reverse proxy ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aih.example.com;

    # certbot-managed certificates (paths may differ on RHEL / Alma)
    ssl_certificate     /etc/letsencrypt/live/aih.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aih.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Allow uploads up to 50 MB (matches Settings.max_upload_size_mb)
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Backend (FastAPI on 127.0.0.1:8000) ─────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;        # Critical: makes FastAPI issue Secure cookies
        proxy_set_header Connection        "";

        # SSE (server-sent events) needs long timeouts and no buffering
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;

        proxy_pass_request_headers on;
    }

    # ── Frontend SPA bundle ──────────────────────────────────────────────
    root /opt/ai-hunter/frontend/dist;
    index index.html;

    # Hashed assets (Vite puts them under /assets/)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every unknown path serves index.html so TanStack Router
    # can take over routing on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
